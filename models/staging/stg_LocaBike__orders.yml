version: 2

models:
  - name: stg_locabike__orders
    description: "Table de staging contenant les informations brutes nettoyées relatives aux commandes de Locabike."
    columns:
      - name: order_id
        data_type: int64
        description: "clé entre tables orders et orders_item ."
        tests:
          - unique
          - not_null

      - name: customer_id
        data_type: int64
        description: "clé entre tables orders et customers."
        tests:
          - unique
          - not_null


      - name: order_status
        data_type: int64
        description: "Statut de la commande (ex: 1 = En attente, 2 = Traitée, 3 = Expédiée, 4 = Annulée)."

      - name: order_date
        data_type: date
        description: "Date à laquelle la commande a été passée par le client"

      - name: required_date
        data_type: date
        description: "Date de livraison attendue par le client"

      - name: shipped_date
        data_type: string
        description: "Date réelle d'expédition de la commande"

      - name: store_id
        data_type: int64
        description: "Identifiant unique du magasin , clé entre table orders et stores"

      - name: staff_id
        data_type: int64
        description: "Identifiant unique du staff, clé entre table ordres et staffs"
