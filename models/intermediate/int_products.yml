version: 2

models:
  - name: int_products
    description: "Modèle intermédiaire combinant les produits avec leurs marques et catégories associées."
    columns:
      - name: product_id
        description: "Clé primaire unique de chaque produit."
        tests:
          - unique
          - not_null

      - name: brand_id
        description: "Clé étrangère de la marque associée au produit."
        tests:
          - not_null

      - name: category_id
        description: "Clé étrangère de la catégorie associée au produit."
        tests:
          - not_null

      - name: brand_name
        description: "Nom de la marque du produit)."
        tests:
          - not_null

      - name: product_name
        description: "Nom du produit."
        tests:
          - not_null

      - name: category_name
        description: "Nom de la catégorie de vélo."
        tests:
          - not_null

      - name: model_year
        description: "Année du modèle."
        tests:
          - not_null

      - name: price
        description: "Prix de vente standard du produit (list_price d'origine)."
        tests:
          - not_null