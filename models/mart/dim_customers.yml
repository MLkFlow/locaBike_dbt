version: 2

models:
  - name: dim_customers
    description: "Table de dimension finale centralisant les informations de chaque client."
    columns:
      - name: customer_id
        description: "Clé primaire unique du client."
        tests:
          - unique
          - not_null

      - name: last_name
        description: "Nom de famille du client."
        tests:
          - not_null

      - name: city
        description: "Ville de résidence du client."
        tests:
          - not_null

      - name: zip_code
        description: "Code postal de l'adresse du client."