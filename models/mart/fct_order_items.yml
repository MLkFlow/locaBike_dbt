version: 2

models:
  - name: fct_order_items
    description: "Table de faits consolidant les ventes au niveau de chaque article commandé. Elle contient les clés de jointure vers les dimensions et les métriques financières calculées."

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - item_id

    columns:
      - name: order_id
        description: "Identifiant unique de la commande."
        tests:
          - not_null

      - name: item_id
        description: "Identifiant de la commande de l'item au sein de la commande."
        tests:
          - not_null

      - name: customer_id
        description: "Clé étrangère reliant la vente à la dimension dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: product_id
        description: "Clé étrangère reliant la vente à la dimension dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: store_id
        description: "Clé étrangère reliant la vente à la dimension dim_stores."
        tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_id

      - name: order_status
        description: "Statut actuel de la commande."
        tests:
          - not_null

      - name: order_date
        description: "Date de création de la commande."
        tests:
          - not_null

      - name: required_date
        description: "Date de livraison contractuelle ou prévue."
        tests:
          - not_null

      - name: shipped_date
        description: "Date réelle d'expédition de la commande)."

      - name: quantity
        description: "Quantité d'articles achetée pour cette commande."
        tests:
          - not_null

      - name: price
        description: "Prix unitaire catalogue de l'article."
        tests:
          - not_null

      - name: discount
        description: "Taux de remise appliqué à la commande."
        tests:
          - not_null

      - name: amount
        description: "Montant brut théorique de la commande avant remise (quantity * price)."
        tests:
          - not_null

      - name: discount_amount
        description: "Montant total de la remise accordée sur cette commande (quantity * price * discount)."
        tests:
          - not_null

      - name: net_amount
        description: "Montant net final payé par le client pour cette commande."
        tests:
          - not_null
